<!doctype html>
<html>
<head>
    <meta charset="utf-8">
    <title>SeamFlux data test</title>
    <style>
        body { font-family: sans-serif; max-width: 800px; margin: 40px auto; }
        progress { width: 100%; height: 28px; }
        #status { margin-top: 12px; white-space: pre-wrap; font-family: monospace; }
    </style>
</head>
<body>
    <button id="load">POST /api/data</button>
    <progress id="progress"></progress>
    <div id="status">ready</div>

    <script>
        const button = document.getElementById('load');
        const progress = document.getElementById('progress');
        const status = document.getElementById('status');
        const worker = new Worker('/worker.js', { type: 'module' });

        worker.onmessage = ({ data }) => {
            if (data.type === 'progress') {
                status.textContent = `received ${(data.loaded / 1048576).toFixed(1)} MB`;
                return;
            }

            if (data.type === 'done') {
                progress.value = 1;
                progress.max = 1;
                status.textContent +=
                    `\nreceived in ${data.receiveMs.toFixed(1)} ms` +
                    `\ncolumns: ${data.columns.join(', ')}` +
                    `\nrows: ${data.rows}`;

                button.disabled = false;
                return;
            }

            if (data.type === 'error') {
                progress.value = 1;
                progress.max = 1;
                status.textContent = data.message;
                button.disabled = false;
            }
        };

        button.onclick = () => {
            button.disabled = true;
            progress.removeAttribute('value');
            progress.removeAttribute('max');
            status.textContent = 'request...';
            worker.postMessage({ cmd: 'load', offset: 0 });
        };
    </script>
</body>
</html>
